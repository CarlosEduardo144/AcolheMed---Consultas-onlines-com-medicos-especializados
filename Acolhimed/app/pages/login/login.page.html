<ion-content class="login-content" [fullscreen]="true">
  <div class="login-wrapper">

    <!-- Header -->
    <div class="login-header">
      <span class="login-title">Login</span>
    </div>

    <!-- Avatar Icon -->
    <div class="avatar-container">
      <svg width="145" height="152" viewBox="0 0 145 152" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="login()">

      <!-- Email Field -->
      <div class="form-group">
        <div class="input-wrapper" [class.input-error]="email?.invalid && email?.touched">
          <ion-input
            formControlName="email"
            type="email"
            placeholder="E-mail"
            class="custom-input"
            
          ></ion-input>
        </div>
        <div class="error-messages" *ngIf="email?.invalid && email?.touched">
          <ion-text color="danger" *ngIf="email?.errors?.['required']">
            <small>E-mail é obrigatório.</small>
          </ion-text>
          <ion-text color="danger" *ngIf="email?.errors?.['email']">
            <small>Informe um e-mail válido.</small>
          </ion-text>
        </div>
      </div>

      <!-- senha Field -->
      <div class="form-group">
        <div class="input-wrapper" [class.input-error]="senha?.invalid && senha?.touched">
          <ion-input
            formControlName="senha"
            type="password"
            placeholder="Senha"
            class="custom-input"
      
          ></ion-input>
        </div>
        <div class="error-messages" *ngIf="senha?.invalid && senha?.touched">
          <ion-text color="danger" *ngIf="senha?.errors?.['required']">
            <small>Senha é obrigatória.</small>
          </ion-text>
          <ion-text color="danger" *ngIf="senha?.errors?.['minlength']">
            <small>A senha deve ter no mínimo 6 caracteres.</small>
          </ion-text>
        </div>
      </div>

      <!-- Login Button -->
      <div class="form-group">
        <ion-button
          expand="block"
          type="submit"
          class="login-button"
          [disabled]="loginForm.invalid"
        >
          Login
        </ion-button>
      </div>

      <!-- Sign Up Links -->
      <div class="signup-container">
        <ion-text class="signup-text">Não possui conta?</ion-text>
        <a routerLink="/cadastro" class="signup-link">Cadastrar</a>
      </div>

    </form>
  </div>
</ion-content>
