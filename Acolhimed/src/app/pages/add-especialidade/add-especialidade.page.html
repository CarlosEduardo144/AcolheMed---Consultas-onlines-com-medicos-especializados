<ion-content class="especialidades-content" [fullscreen]="true">

  <!-- Hero Banner -->
  <div class="hero-banner">
    <div class="hero-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <!-- Botão fechar -->
    <button class="header-close" routerLink="/perfil">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M21 12C21 12.4142 20.6642 12.75 20.25 12.75H5.56031L11.0306 18.2194C11.3237 18.5124 11.3237 18.9876 11.0306 19.2806C10.7376 19.5737 10.2624 19.5737 9.96937 19.2806L3.21937 12.5306C3.07854 12.3899 2.99941 12.1991 2.99941 12C2.99941 11.8009 3.07854 11.6101 3.21937 11.4694L9.96937 4.71938C10.2624 4.42632 10.7376 4.42632 11.0306 4.71938C11.3237 5.01243 11.3237 5.48757 11.0306 5.78062L5.56031 11.25H20.25C20.6642 11.25 21 11.5858 21 12Z"
          fill="white" />
      </svg>
    </button>

    <!-- Ícone: capelo + pulso médico -->
    <div class="hero-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L1 9L12 15L23 9L12 3Z" fill="white" opacity="0.95" />
        <path d="M5 11.2V16.2C5 16.2 6.5 19 12 19C17.5 19 19 16.2 19 16.2V11.2" stroke="white" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.55" fill="none" />
        <path d="M4 12.5L7.5 12.5L9 10.5L10.5 15L12 12.5L14 12.5" stroke="white" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9" fill="none" />
      </svg>
    </div>

    <div class="hero-text">
      <h2>Minhas Especialidades</h2>
      <p>Escolha suas áreas de conhecimento</p>
    </div>
  </div>

  <!-- Card branco -->
  <div class="form-card">

    <!-- Dica -->
    <div class="tip-card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#29ABE2" stroke-width="1.8" />
        <path d="M12 8V12M12 16H12.01" stroke="#29ABE2" stroke-width="2" stroke-linecap="round" />
      </svg>
      <p>Você pode escolher mais de uma especialidade. É possível alterar isso depois no seu perfil.</p>
    </div>

    <!-- Lista de especialidades -->
    <ion-list lines="full" *ngIf="!carregando" class="lista-especialidades">
      <ion-item *ngFor="let especialidade of especialidades" button detail="false" lines="full"
        (click)="toggleSelecao(especialidade.id)">
        <ion-avatar slot="start">
          <img [src]="especialidade.imagemUrl" [alt]="especialidade.nome" />
        </ion-avatar>

        <ion-label>{{ especialidade.nome }}</ion-label>

        <label class="custom-checkbox">
          <input type="checkbox" [checked]="isSelecionada(especialidade.id)" (change)="toggleSelecao(especialidade.id)">
          <span class="checkmark"></span>
        </label>
      </ion-item>
    </ion-list>

    <div class="ion-text-center ion-padding" *ngIf="carregando">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Botão Salvar -->
    <button type="button" class="salvar-btn" [disabled]="selecionadas.size === 0" (click)="salvar()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16L21 8V19C21 20.1046 20.1046 21 19 21Z"
          stroke="white" stroke-width="2" stroke-linejoin="round" />
        <path d="M17 21V13H7V21M7 3V8H15" stroke="white" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Salvar especialidades
    </button>

  </div>

</ion-content>
