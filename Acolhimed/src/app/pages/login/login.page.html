<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<ion-content class="login-content" [fullscreen]="true">
  <div class="login-wrapper">

    <!-- Hero -->
    <div class="hero-banner">
      <div class="hero-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
      </div>

      <div class="brand-row">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 20.5C12 20.5 3.5 15.5 3.5 9.3C3.5 6.4 5.8 4 8.7 4C10.1 4 11.3 4.7 12 5.8C12.7 4.7 13.9 4 15.3 4C18.2 4 20.5 6.4 20.5 9.3C20.5 15.5 12 20.5 12 20.5Z"
              stroke="white" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M8 10.5H10L11 8.5L13 13L14 10.5H16" stroke="white" stroke-width="1.4" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <span class="brand-nome">AcolhiMed</span>
      </div>

      <h1 class="hero-titulo">Bem-vindo de volta!</h1>
      <p class="hero-subtitulo">Acesse sua conta para agendar consultas e falar com médicos.</p>
    </div>

    <!-- Card branco -->
    <div class="form-card">
      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <!-- Email Field -->
        <div class="form-group">
          <label class="input-label">E-mail</label>
          <div class="input-wrapper" [class.input-error]="email?.invalid && email?.touched">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M3 6.75C3 5.7835 3.7835 5 4.75 5H19.25C20.2165 5 21 5.7835 21 6.75V17.25C21 18.2165 20.2165 19 19.25 19H4.75C3.7835 19 3 18.2165 3 17.25V6.75Z"
                stroke="#29ABE2" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M4 7L12 13L20 7" stroke="#29ABE2" stroke-width="1.6" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
            <ion-input formControlName="email" type="email" placeholder="voce@exemplo.com"
              class="custom-input"></ion-input>
          </div>
          <div class="error-messages" *ngIf="email?.invalid && email?.touched">
            <ion-text color="danger" *ngIf="email?.errors?.['required']">
              <small>E-mail é obrigatório.</small>
            </ion-text>
            <ion-text color="danger" *ngIf="email?.errors?.['email']">
              <small>Informe um e-mail válido.</small>
            </ion-text>
          </div>
        </div>

        <!-- senha Field -->
        <div class="form-group">
          <label class="input-label">Senha</label>
          <div class="input-wrapper" [class.input-error]="senha?.invalid && senha?.touched">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="10.5" width="14" height="9" rx="2" stroke="#29ABE2" stroke-width="1.6" />
              <path d="M8 10.5V7.5C8 5.567 9.567 4 11.5 4H12.5C14.433 4 16 5.567 16 7.5V10.5" stroke="#29ABE2"
                stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <ion-input formControlName="senha" [type]="showSenha ? 'text' : 'password'" placeholder="••••••••"
              class="custom-input"></ion-input>

            <!-- Toggle visualizar senha: você adiciona o (click) e a lógica no .ts -->
            <button type="button" class="toggle-senha" (click)="showSenha = !showSenha">
              <svg *ngIf="!showSenha" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="#AAAAAA"
                  stroke-width="1.8" />
                <circle cx="12" cy="12" r="3" stroke="#AAAAAA" stroke-width="1.8" />
              </svg>
              <svg *ngIf="showSenha" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path
                  d="M17.94 17.94C16.2306 19.243 14.1491 19.9649 12 20C5 20 1 12 1 12C2.24389 9.68192 3.96914 7.65663 6.06 6.06M9.9 4.24C10.5883 4.0789 11.2931 3.99836 12 4C19 4 23 12 23 12C22.393 13.1356 21.6691 14.2047 20.84 15.19M1 1L23 23"
                  stroke="#AAAAAA" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div class="error-messages" *ngIf="senha?.invalid && senha?.touched">
            <ion-text color="danger" *ngIf="senha?.errors?.['required']">
              <small>Senha é obrigatória.</small>
            </ion-text>
            <ion-text color="danger" *ngIf="senha?.errors?.['minlength']">
              <small>A senha deve ter no mínimo 4 caracteres.</small>
            </ion-text>
          </div>
        </div>

        <!-- Sign Up Links -->
        <div class="signup-container">
          <span class="signup-text">Ainda não tem conta?</span>
          <a routerLink="/cadastro" class="signup-link">Cadastre-se</a>
        </div>

        <!-- Login Button -->
        <div class="form-group">
          <ion-button expand="block" type="submit" class="login-button" [disabled]="loginForm.invalid">
            Entrar
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" slot="end">
              <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </ion-button>
        </div>

        <!-- Divisor -->
        <div class="divider-container">
          <span class="divider-line"></span>
          <span class="divider-texto">OU</span>
          <span class="divider-line"></span>
        </div>

        <!-- Continuar com Google -->
        <button type="button" class="google-button">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continuar com Google
        </button>

      </form>
    </div>

  </div>
</ion-content>
