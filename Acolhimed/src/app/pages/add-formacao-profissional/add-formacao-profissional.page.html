<ion-content class="alterar-content" [fullscreen]="true">

  <!-- Hero Banner -->
  <div class="hero-banner">
    <div class="hero-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
    <div class="hero-icon">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L1 9L5 11.18V17.18L12 21L19 17.18V11.18L21 10.09V17H23V9L12 3Z" fill="white" opacity="0.95"/>
        <path d="M17 13.99L12 17L7 13.99V11.82L12 15L17 11.82V13.99Z" fill="white" opacity="0.6"/>
      </svg>
    </div>
    <div class="hero-text">
      <h2>Perfil Profissional</h2>
      <p>Destaque sua trajetória e conquistas</p>
    </div>

    <!-- Back button sobreposto -->
    <button class="header-back" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M21 12C21 12.4142 20.6642 12.75 20.25 12.75H5.56031L11.0306 18.2194C11.3237 18.5124 11.3237 18.9876 11.0306 19.2806C10.7376 19.5737 10.2624 19.5737 9.96937 19.2806L3.21937 12.5306C3.07854 12.3899 2.99941 12.1991 2.99941 12C2.99941 11.8009 3.07854 11.6101 3.21937 11.4694L9.96937 4.71938C10.2624 4.42632 10.7376 4.42632 11.0306 4.71938C11.3237 5.01243 11.3237 5.48757 11.0306 5.78062L5.56031 11.25H20.25C20.6642 11.25 21 11.5858 21 12Z"
          fill="white" />
      </svg>
    </button>

    <div class="hero-title-top">Alterar formação</div>
  </div>

  <!-- Form Card -->
  <div class="form-card">

    <form [formGroup]="alterarForm" (ngSubmit)="salvar()">

      <!-- Seção: Meus dados -->
      <div class="section-block">
        <div class="section-header">
          <div class="section-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 3L1 9L12 15L23 9L12 3Z" fill="#29ABE2"/>
              <path d="M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" fill="#29ABE2" opacity="0.6"/>
            </svg>
          </div>
          <span class="section-title">Meus dados</span>
        </div>

        <!-- Formação Acadêmica -->
        <div class="field-group">
          <div class="field-label-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="3" width="16" height="18" rx="2" stroke="#29ABE2" stroke-width="1.8"/>
              <path d="M8 8H16M8 12H16M8 16H12" stroke="#29ABE2" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <label class="field-label">Formação Acadêmica</label>
          </div>
          <div class="textarea-wrap">
            <textarea
              class="field-textarea"
              formControlName="formacaoAcademica"
              placeholder="Ex: Medicina pela USP (2010), Residência em Cardiologia pelo InCor (2013), Doutorado em Cardiologia Intervencionista (2016)..."
              rows="4"
            ></textarea>
            <div class="char-count">
              <span [class.warn]="alterarForm.get('formacaoAcademica')?.value?.length > 400">
                {{ alterarForm.get('formacaoAcademica')?.value?.length || 0 }}/500
              </span>
            </div>
          </div>
        </div>

        <!-- Sobre mim -->
        <div class="field-group">
          <div class="field-label-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="#29ABE2" stroke-width="1.8"/>
              <path d="M4 20C4 17.2386 7.58172 15 12 15C16.4183 15 20 17.2386 20 20" stroke="#29ABE2" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <label class="field-label">Sobre mim</label>
          </div>
          <div class="textarea-wrap">
            <textarea
              class="field-textarea"
              formControlName="sobreMim"
              placeholder="Conte um pouco sobre sua experiência, áreas de interesse, abordagem com pacientes e diferenciais da sua prática médica..."
              rows="5"
            ></textarea>
            <div class="char-count">
              <span [class.warn]="alterarForm.get('sobreMim')?.value?.length > 450">
                {{ alterarForm.get('sobreMim')?.value?.length || 0 }}/500
              </span>
            </div>
          </div>
        </div>

      </div>

      <!-- Dica -->
      <div class="tip-card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#29ABE2" stroke-width="1.8"/>
          <path d="M12 8V12M12 16H12.01" stroke="#29ABE2" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p>Um perfil completo aumenta sua visibilidade e gera mais confiança nos pacientes.</p>
      </div>

      <!-- Botão Salvar -->
      <button type="submit" class="salvar-btn" [disabled]="!alterarForm.valid">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16L21 8V19C21 20.1046 20.1046 21 19 21Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          <path d="M17 21V13H7V21M7 3V8H15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Salvar alterações
      </button>

    </form>
  </div>

</ion-content>
