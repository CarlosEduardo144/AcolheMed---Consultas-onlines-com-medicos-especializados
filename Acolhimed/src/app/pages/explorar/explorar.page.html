<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Explorar</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openFiltros()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" slot="icon-only">
          <path d="M4 6H20M7 12H17M10 18H14" stroke="#141414" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="6" cy="6" r="1.5" fill="#141414"/>
          <circle cx="14" cy="12" r="1.5" fill="#141414"/>
          <circle cx="10" cy="18" r="1.5" fill="#141414"/>
        </svg>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="explorar-content">

  <!-- Search Bar -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10.5 2.25C6.00 2.25 2.25 6.00 2.25 10.5C2.25 14.9978 6.00 18.75 10.5 18.75C12.4628 18.75 14.261 18.0547 15.6655 16.8977L20.4697 21.7019C20.7626 21.9948 21.2374 21.9948 21.5303 21.7019C21.8232 21.409 21.8232 20.9342 21.5303 20.6413L16.726 15.8371C17.9558 14.4209 18.75 12.5481 18.75 10.5C18.75 6.00 14.9978 2.25 10.5 2.25Z" fill="#9E9E9E"/>
      </svg>
      <input type="text" placeholder="Pesquisar por especialidade" [(ngModel)]="textoBusca" (input)="filtrarEspecialidades()" />
    </div>
  </div>

  <!-- Médicos em destaque -->
  <div class="section">
    <h2 class="section-title">Médicos em destaque</h2>
    <div class="horizontal-scroll">
      <div class="medico-card" *ngFor="let medico of medicos" (click)="verMedico(medico)">
        <div class="medico-img-wrap">
          <!-- <img [src]="medico.usuario.foto" [alt]="medico.usuario.nome" /> -->
        </div>
        <p class="medico-nome">{{ medico.usuario.nome }}</p>
        <p class="medico-info">
          <span class="medico-especialidade">SemEspecialidade</span>
          <span class="medico-rating">
            4
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#FACC15" stroke="#FACC15" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </span>
        </p>
      </div>
    </div>
  </div>

  <!-- Especialidades -->
  <div class="section">
    <h2 class="section-title">Especialidades em alta</h2>
    <div class="horizontal-scroll especialidades-scroll">
      <div class="especialidade-card" *ngFor="let esp of especialidades">
        <div class="esp-img-wrap" style="background-color: rgb(154, 63, 154);">
           <img [src]="esp.imagemUrl" [alt]="esp.nome" />
        </div>
        <p class="esp-nome">{{ esp.nome }}</p>
      </div>
    </div>
  </div>

  <div class="bottom-spacer"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a routerLink="/inicio" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.5153 9.72844L13.0153 2.65219C13.0116 2.64899 13.0082 2.64554 13.005 2.64188C12.4328 2.1215 11.5588 2.1215 10.9866 2.64188L10.9762 2.65219L3.48469 9.72844C3.17573 10.0125 2.99994 10.4131 3 10.8328V19.5C3 20.3284 3.67157 21 4.5 21H9C9.82843 21 10.5 20.3284 10.5 19.5V15H13.5V19.5C13.5 20.3284 14.1716 21 15 21H19.5C20.3284 21 21 20.3284 21 19.5V10.8328C21.0001 10.4131 20.8243 10.0125 20.5153 9.72844ZM19.5 19.5H15V15C15 14.1716 14.3284 13.5 13.5 13.5H10.5C9.67157 13.5 9 14.1716 9 15V19.5H4.5V10.8328L4.51031 10.8234L12 3.75L19.4906 10.8216L19.5009 10.8309L19.5 19.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Home</span>
    </a>
    <a routerLink="/consultas" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M19.5 3H17.25V2.25C17.25 1.83579 16.9142 1.5 16.5 1.5C16.0858 1.5 15.75 1.83579 15.75 2.25V3H8.25V2.25C8.25 1.83579 7.91421 1.5 7.5 1.5C7.08579 1.5 6.75 1.83579 6.75 2.25V3H4.5C3.67157 3 3 3.67157 3 4.5V19.5C3 20.3284 3.67157 21 4.5 21H19.5C20.3284 21 21 20.3284 21 19.5V4.5C21 3.67157 20.3284 3 19.5 3ZM6.75 4.5V5.25C6.75 5.66421 7.08579 6 7.5 6C7.91421 6 8.25 5.66421 8.25 5.25V4.5H15.75V5.25C15.75 5.66421 16.0858 6 16.5 6C16.9142 6 17.25 5.66421 17.25 5.25V4.5H19.5V7.5H4.5V4.5H6.75ZM19.5 19.5H4.5V9H19.5V19.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Consultas</span>
    </a>
    <a routerLink="/explorar" class="nav-item nav-item--active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M21.5306 20.4694L16.8366 15.7762C19.6629 12.383 19.3204 7.36693 16.0591 4.38935C12.7978 1.41176 7.77134 1.526 4.64867 4.64867C1.526 7.77134 1.41176 12.7978 4.38935 16.0591C7.36693 19.3204 12.383 19.6629 15.7762 16.8366L20.4694 21.5306C20.7624 21.8237 21.2376 21.8237 21.5306 21.5306C21.8237 21.2376 21.8237 20.7624 21.5306 20.4694ZM3.75 10.5C3.75 6.77208 6.77208 3.75 10.5 3.75C14.2279 3.75 17.25 6.77208 17.25 10.5C17.25 14.2279 14.2279 17.25 10.5 17.25C6.77379 17.2459 3.75413 14.2262 3.75 10.5Z"
          fill="#141414" />
      </svg>
      <span class="nav-label nav-label--active">Explorar</span>

   <a routerLink="/perfil" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M12 12C14.4853 12 16.5 9.98528 16.5 7.5C16.5 5.01472 14.4853 3 12 3C9.51472 3 7.5 5.01472 7.5 7.5C7.5 9.98528 9.51472 12 12 12ZM12 13.5C8.13401 13.5 4.91017 15.9976 4.00391 19.5H19.9961C19.0898 15.9976 15.866 13.5 12 13.5ZM12 1.5C15.3137 1.5 18 4.18629 18 7.5C18 9.47392 17.0461 11.2251 15.5736 12.3193C18.4777 13.5308 20.617 16.1452 21 19.3125C21.0266 19.5327 20.9569 19.753 20.8087 19.9181C20.6605 20.0831 20.4492 20.1774 20.2273 20.1774H3.77273C3.55082 20.1774 3.33948 20.0831 3.1913 19.9181C3.04312 19.753 2.9734 19.5327 3 19.3125C3.38302 16.1452 5.52235 13.5308 8.42641 12.3193C6.9539 11.2251 6 9.47392 6 7.5C6 4.18629 8.68629 1.5 12 1.5Z"

  </div>

</ion-content>
