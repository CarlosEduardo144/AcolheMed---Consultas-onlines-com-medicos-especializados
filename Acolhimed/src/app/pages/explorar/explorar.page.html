<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<ion-content class="explorar-content" [fullscreen]="true">

  <!-- Hero Banner -->
  <div class="hero-banner">
    <div class="hero-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
    </div>

    <div class="hero-topbar">
      <h1 class="hero-titulo" style="font-family: 'Nunito', Arial, sans-serif;">Explorar</h1>
      <button class="btn-filtro">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 6H20M7 12H17M10 18H14" stroke="white" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path
          d="M10.5 2.25C6.00 2.25 2.25 6.00 2.25 10.5C2.25 14.9978 6.00 18.75 10.5 18.75C12.4628 18.75 14.261 18.0547 15.6655 16.8977L20.4697 21.7019C20.7626 21.9948 21.2374 21.9948 21.5303 21.7019C21.8232 21.409 21.8232 20.9342 21.5303 20.6413L16.726 15.8371C17.9558 14.4209 18.75 12.5481 18.75 10.5C18.75 6.00 14.9978 2.25 10.5 2.25Z"
          fill="#9E9E9E" />
      </svg>
      <input type="text" placeholder="Pesquisar por especialidade" [(ngModel)]="textoBusca" />
    </div>
  </div>

  <!-- Corpo -->
  <div class="corpo-content">


    <!-- Médicos em destaque -->
    <div class="section" *ngFor="let medico of medicos">
      @if(medico.especialidades.length > 0){
      <div class="section-header">
        <h2 class="section-title">Médicos em destaque</h2>
        <a class="ver-todos">Ver todos</a>
      </div>

      <div class="horizontal-scroll medicos-scroll">
        <div class="medico-card-destaque">
          <div class="medico-img-wrap" [routerLink]="['/medico', medico.id]">
            <img [src]="medico?.foto" [alt]="medico.nome" />
          </div>
          <div class="medico-info-wrap">
            <p class="medico-nome">{{ medico.nome }}</p>
            <p class="medico-especialidade">{{ medico.especialidades[0].nome }}</p>
            <div class="medico-rating">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
                  fill="#FACC15" stroke="#FACC15" stroke-width="1.5" stroke-linejoin="round" />
              </svg>
              <span class="rating-numero">4.5</span>
              <span class="rating-total">129</span>
            </div>
          </div>
        </div>
      </div>
      }
    </div>

    <!-- Especialidades em alta -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Especialidades em alta</h2>
      </div>

      <div class="horizontal-scroll especialidades-scroll">
        <div class="especialidade-card-overlay" *ngFor="let especialidade of especialidades">
          <img [src]="especialidade.imagemUrl" [alt]="especialidade.nome" />
          <div class="overlay-gradient"></div>
          <span class="esp-nome-overlay">{{ especialidade.nome }}</span>
        </div>
      </div>
    </div>

    <!-- Dicas de saúde -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Dicas de saúde</h2>
      </div>
      <div class="dicas-lista">
        <div class="dica-card" *ngFor="let dica of dicasSaude">
          <div class="dica-img-wrap">
            <img [src]="dica.imagemUrl" [alt]="dica.titulo" />
          </div>

          <div class="dica-texto">
            <p class="dica-titulo">
              <svg *ngIf="dica.icone === 'alimentacao'" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M12 3C12 3 7 6 7 12C7 16.4183 9.68629 20 12 20C14.3137 20 17 16.4183 17 12C17 6 12 3 12 3Z"
                  stroke="#29ABE2" stroke-width="1.6" stroke-linejoin="round" />
              </svg>
              <svg *ngIf="dica.icone === 'sono'" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  d="M20 14.5C18.8 15.4 17.3 16 15.6 16C11.4 16 8 12.6 8 8.4C8 6.7 8.6 5.2 9.5 4C6 5 3.5 8.2 3.5 12C3.5 16.7 7.3 20.5 12 20.5C15.8 20.5 19 18 20 14.5Z"
                  stroke="#29ABE2" stroke-width="1.6" stroke-linejoin="round" />
              </svg>
              <svg *ngIf="dica.icone === 'coracao'" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 20.5C12 20.5 3.5 15.5 3.5 9.3C3.5 6.4 5.8 4 8.7 4C10.1 4 11.3 4.7 12 5.8C12.7 4.7 13.9 4 15.3 4C18.2 4 20.5 6.4 20.5 9.3C20.5 15.5 12 20.5 12 20.5Z"
                  stroke="#29ABE2" stroke-width="1.6" stroke-linejoin="round" />
              </svg>
              {{ dica.titulo }}
            </p>
            <p class="dica-descricao">{{ dica.descricao }}</p>
          </div>

          <svg class="dica-seta" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 6L15 12L9 18" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>

    <div class="bottom-spacer"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a routerLink="/inicio" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.5153 9.72844L13.0153 2.65219C13.0116 2.64899 13.0082 2.64554 13.005 2.64188C12.4328 2.1215 11.5588 2.1215 10.9866 2.64188L10.9762 2.65219L3.48469 9.72844C3.17573 10.0125 2.99994 10.4131 3 10.8328V19.5C3 20.3284 3.67157 21 4.5 21H9C9.82843 21 10.5 20.3284 10.5 19.5V15H13.5V19.5C13.5 20.3284 14.1716 21 15 21H19.5C20.3284 21 21 20.3284 21 19.5V10.8328C21.0001 10.4131 20.8243 10.0125 20.5153 9.72844Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Início</span>
    </a>
    <a routerLink="/consultas" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M19.5 3H17.25V2.25C17.25 1.83579 16.9142 1.5 16.5 1.5C16.0858 1.5 15.75 1.83579 15.75 2.25V3H8.25V2.25C8.25 1.83579 7.91421 1.5 7.5 1.5C7.08579 1.5 6.75 1.83579 6.75 2.25V3H4.5C3.67157 3 3 3.67157 3 4.5V19.5C3 20.3284 3.67157 21 4.5 21H19.5C20.3284 21 21 20.3284 21 19.5V4.5C21 3.67157 20.3284 3 19.5 3ZM6.75 4.5V5.25C6.75 5.66421 7.08579 6 7.5 6C7.91421 6 8.25 5.66421 8.25 5.25V4.5H15.75V5.25C15.75 5.66421 16.0858 6 16.5 6C16.9142 6 17.25 5.66421 17.25 5.25V4.5H19.5V7.5H4.5V4.5H6.75ZM19.5 19.5H4.5V9H19.5V19.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Consultas</span>
    </a>
    <a routerLink="/explorar" class="nav-item nav-item--active">
      <div class="nav-icon-wrap nav-icon-wrap--active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M21.5306 20.4694L16.8366 15.7762C19.6629 12.383 19.3204 7.36693 16.0591 4.38935C12.7978 1.41176 7.77134 1.526 4.64867 4.64867C1.526 7.77134 1.41176 12.7978 4.38935 16.0591C7.36693 19.3204 12.383 19.6629 15.7762 16.8366L20.4694 21.5306C20.7624 21.8237 21.2376 21.8237 21.5306 21.5306C21.8237 21.2376 21.8237 20.7624 21.5306 20.4694ZM3.75 10.5C3.75 6.77208 6.77208 3.75 10.5 3.75C14.2279 3.75 17.25 6.77208 17.25 10.5C17.25 14.2279 14.2279 17.25 10.5 17.25C6.77379 17.2459 3.75413 14.2262 3.75 10.5Z"
            fill="#29ABE2" />
        </svg>
      </div>
      <span class="nav-label nav-label--active">Explorar</span>
    </a>
    <a routerLink="/perfil" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M12 12C14.4853 12 16.5 9.98528 16.5 7.5C16.5 5.01472 14.4853 3 12 3C9.51472 3 7.5 5.01472 7.5 7.5C7.5 9.98528 9.51472 12 12 12ZM12 13.5C8.13401 13.5 4.91017 15.9976 4.00391 19.5H19.9961C19.0898 15.9976 15.866 13.5 12 13.5ZM12 1.5C15.3137 1.5 18 4.18629 18 7.5C18 9.47392 17.0461 11.2251 15.5736 12.3193C18.4777 13.5308 20.617 16.1452 21 19.3125C21.0266 19.5327 20.9569 19.753 20.8087 19.9181C20.6605 20.0831 20.4492 20.1774 20.2273 20.1774H3.77273C3.55082 20.1774 3.33948 20.0831 3.1913 19.9181C3.04312 19.753 2.9734 19.5327 3 19.3125C3.38302 16.1452 5.52235 13.5308 8.42641 12.3193C6.9539 11.2251 6 9.47392 6 7.5C6 4.18629 8.68629 1.5 12 1.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Perfil</span>
    </a>
  </div>

</ion-content>
