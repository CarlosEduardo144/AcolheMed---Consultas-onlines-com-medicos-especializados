<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-avatar class="header-avatar" routerLink="/perfil">
        <img [src]="usuario.foto || 'https://i.pravatar.cc/100?img=47'" [alt]="usuario.nome || 'Perfil'" />
      </ion-avatar>
    </ion-buttons>
    <ion-title>Início</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="inicio-content" [fullscreen]="true">

  <!-- Boas-vindas -->
  <div class="welcome-section">
    <h1 class="welcome-text">Bem-vindo,<br />{{ usuario.nome }}</h1>
  </div>

  <!-- Cards de estatísticas -->
  <div class="stats-row">
    <div class="stat-card">
      <p class="stat-label">Especialidades<br />disponíveis</p>
      <p class="stat-value">{{especialidadesDisponiveis}}</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Médicos<br />disponíveis</p>
      <p class="stat-value">{{medicosDisponiveis}}</p>
    </div>
  </div>

  <!-- Botão Agendar -->
  <div class="agendar-wrap">
    <ion-button expand="block" class="agendar-btn" routerLink="/explorar">
      Agendar consulta
    </ion-button>
  </div>

  <!-- Consultas em andamento -->
  <div class="section">
    <h2 class="section-title">Consultas em andamento</h2>

    <div class="consulta-card">
      <div class="consulta-avatar">
        <ion-icon name="happy-outline"></ion-icon>
      </div>

      <div class="consulta-body">
        <div class="consulta-top">
          <div class="consulta-info">
            <p class="consulta-doctor">Dr. Pi'u piu</p>
            <p class="consulta-time">10:00 h <span class="dot">•</span></p>
          </div>
          <ion-button class="btn-chat">
            <ion-icon name="chatbubble" slot="start"></ion-icon>
            Chat
          </ion-button>
        </div>

        <div class="consulta-bottom">
          <div class="doctor-icon-wrap">
            <ion-icon name="person-outline" ></ion-icon>
          </div>
          <ion-button class="btn-chamada">
            Chamada
          </ion-button>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <a routerLink="/inicio" class="nav-item nav-item--active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

</ion-content>
