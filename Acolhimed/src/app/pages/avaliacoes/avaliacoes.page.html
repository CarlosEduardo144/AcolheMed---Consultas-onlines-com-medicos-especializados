<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<ion-content class="avaliacoes-content" [fullscreen]="true">
  <div *ngIf="carregando; else conteudoAvaliacoes" class="page-loading-shell">
    <div class="page-loading-dots" aria-label="Carregando">
      <span></span><span></span><span></span>
    </div>
  </div>

  <ng-template #conteudoAvaliacoes>
    <div class="page-wrapper">

      <!-- Header -->
      <div class="header-topo">
        <!-- Back button sobreposto -->
        <button class="header-back" onclick="history.back()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M21 12C21 12.4142 20.6642 12.75 20.25 12.75H5.56031L11.0306 18.2194C11.3237 18.5124 11.3237 18.9876 11.0306 19.2806C10.7376 19.5737 10.2624 19.5737 9.96937 19.2806L3.21937 12.5306C3.07854 12.3899 2.99941 12.1991 2.99941 12C2.99941 11.8009 3.07854 11.6101 3.21937 11.4694L9.96937 4.71938C10.2624 4.42632 10.7376 4.42632 11.0306 4.71938C11.3237 5.01243 11.3237 5.48757 11.0306 5.78062L5.56031 11.25H20.25C20.6642 11.25 21 11.5858 21 12Z"
              fill="white" />
          </svg>
        </button>

        <h1 class="header-titulo" style="font-family: 'Nunito', Arial, sans-serif;">Avaliações</h1>

        <button class="btn-icon-header" [class.header-btn--filtro-ativo]="painelFiltroAberto" (click)="toggleFiltro()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 6H20L14 13.5V20L10 18V13.5L4 6Z" [attr.stroke]="painelFiltroAberto ? 'white' : '#141414'"
              stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Corpo -->
      <div class="corpo-content">

        <ng-container>

          <!-- Card resumo -->
          <div class="resumo-card">

            <div class="resumo-filtro-info">
              <img *ngIf="medico?.foto" [src]="medico?.foto" [alt]="medico?.nome" />
              <div class="medico-avatar" *ngIf="!medico?.foto">
                <span>{{ iniciais(medico.nome) }}</span>
              </div>
            </div>


            <div style="display: flex; flex-direction: column;">
              <span class="paciente-nome" style="font-family: 'Nunito', Arial, sans-serif;">Dr. {{
                 medico?.nome }}</span>

              <div class="resumo-nota">
                <span class="resumo-numero"  style="font-family: 'Nunito', Arial, sans-serif;">{{ mediaGeralFormatada }}</span>
                <div class="resumo-estrelas">
                  <svg *ngFor="let preenchida of estrelasArray(mediaGeral)" width="15" height="15" viewBox="0 0 24 24"
                    [attr.fill]="preenchida ? '#F5A623' : '#E0E0E0'">
                    <path d="M12 2L14.9 8.6L22 9.3L16.7 14.1L18.2 21.2L12 17.6L5.8 21.2L7.3 14.1L2 9.3L9.1 8.6L12 2Z" />
                  </svg>
                </div>

              </div>
              <span class="resumo-total">{{ totalAvaliacoes }} avaliações</span>
            </div>
          </div>

          <!-- Painel de filtro (expansível) -->
          <div class="filtro-painel" *ngIf="painelFiltroAberto">

            <span class="filtro-secao-titulo">Nota</span>
            <div class="filtro-chips">
              <button type="button" class="filtro-chip" [class.filtro-chip--ativo]="filtroNota === 'todas'"
                (click)="selecionarFiltroNota('todas')">
                <svg *ngIf="filtroNota === 'todas'" width="12" height="12" viewBox="0 0 24 24" fill="none">
                  <path d="M5 13L9 17L19 7" stroke="white" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
                Todas as notas
              </button>
              <button type="button" class="filtro-chip" *ngFor="let n of filtrosNota"
                [class.filtro-chip--ativo]="filtroNota === n" (click)="selecionarFiltroNota(n)">
                <svg *ngIf="filtroNota === n" width="12" height="12" viewBox="0 0 24 24" fill="none">
                  <path d="M5 13L9 17L19 7" stroke="white" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>

                {{ n }} {{ n === 1 ? 'estrela' : 'estrelas' }}
              </button>
            </div>

            <span class="filtro-secao-titulo">Ordenação</span>
            <div class="filtro-chips">
              <button type="button" class="filtro-chip" [class.filtro-chip--ativo]="filtroOrdenacao === 'recentes'"
                (click)="selecionarOrdenacao('recentes')">
                <svg *ngIf="filtroOrdenacao === 'recentes'" width="12" height="12" viewBox="0 0 24 24" fill="none">
                  <path d="M5 13L9 17L19 7" stroke="white" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
                Mais recentes
              </button>
              <button type="button" class="filtro-chip" [class.filtro-chip--ativo]="filtroOrdenacao === 'antigas'"
                (click)="selecionarOrdenacao('antigas')">
                <svg *ngIf="filtroOrdenacao === 'antigas'" width="12" height="12" viewBox="0 0 24 24" fill="none">
                  <path d="M5 13L9 17L19 7" stroke="white" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
                Mais antigas
              </button>
            </div>
          </div>

          <!-- Lista de avaliações -->
          <ng-container *ngIf="avaliacoesFiltradas.length > 0; else vazio">
            <div class="avaliacao-item" *ngFor="let avaliacao of avaliacoesFiltradas">
              <div class="avaliacao-topo">
                <div class="paciente-avatar">
                  <!--<img *ngIf="avaliacao.pacienteFoto" [src]="avaliacao.pacienteFoto" [alt]="avaliacao.pacienteNome" />-->
                  <span>{{ iniciais(avaliacao.pacienteNome) }}</span>
                </div>
                <div class="avaliacao-info">
                  <span class="paciente-nome" style="font-family: 'Nunito', Arial, sans-serif;">{{
                    avaliacao.pacienteNome }}</span>
                  <span class="avaliacao-data">{{ dataFormatada(avaliacao.data) }}</span>
                </div>
              </div>

              <div class="avaliacao-estrelas">
                <svg *ngFor="let preenchida of estrelasArray(avaliacao.nota)" width="16" height="16" viewBox="0 0 24 24"
                  [attr.fill]="preenchida ? '#F5A623' : '#E0E0E0'">
                  <path d="M12 2L14.9 8.6L22 9.3L16.7 14.1L18.2 21.2L12 17.6L5.8 21.2L7.3 14.1L2 9.3L9.1 8.6L12 2Z" />
                </svg>
              </div>

              <p class="avaliacao-comentario" *ngIf="avaliacao.comentario">{{ avaliacao.comentario }}</p>
            </div>
          </ng-container>

          <ng-template #vazio>
            <div class="empty-state">
              <div class="empty-illustration">
                <svg width="120" height="120" viewBox="0 0 140 140" fill="none">
                  <!-- Fundo circular -->
                  <circle cx="70" cy="70" r="70" fill="#E8F6FD" />
                  <path
                    d="M48 38H92C96.4183 38 100 41.5817 100 46V82C100 86.4183 96.4183 90 92 90H72L58 104V90H48C43.5817 90 40 86.4183 40 82V46C40 41.5817 43.5817 38 48 38Z"
                    fill="white" stroke="#29ABE2" stroke-width="5" stroke-linejoin="round" />

                  <!-- Ícone interno ('X' original) -->
                  <line x1="58" y1="56" x2="82" y2="78" stroke="#29ABE2" stroke-width="5" stroke-linecap="round" />
                  <line x1="82" y1="56" x2="58" y2="78" stroke="#29ABE2" stroke-width="5" stroke-linecap="round" />
                </svg>
              </div>
              <h3 class="empty-texto">Nenhuma avaliação por aqui</h3>
            </div>
          </ng-template>

        </ng-container>

        <div class="bottom-spacer"></div>
      </div>

    </div>
  </ng-template>
</ion-content>
