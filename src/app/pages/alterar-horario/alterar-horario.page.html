<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Horários de Atendimento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Hero — mesmo padrão do meusDados -->
  <div class="page-hero">
    <div class="page-hero-icon">
      <ion-icon name="calendar-outline"></ion-icon>
    </div>
    <div class="page-hero-text">
      <h1>Horários de Atendimento</h1>
      <p>Configure sua disponibilidade semanal</p>
    </div>
  </div>

  <!-- Cards por dia -->
  <div class="days-list">
    <div
      class="day-card"
      [class.disabled]="!day.enabled"
      *ngFor="let day of days"
    >
      <!-- Cabeçalho do dia -->
      <div class="day-header">
        <div class="day-icon">
          <ion-icon name="calendar-outline"></ion-icon>
        </div>
        <span class="day-name">{{ day.label }}</span>
        <ion-toggle
          [(ngModel)]="day.enabled"
          mode="ios"
          class="day-toggle"
        ></ion-toggle>
      </div>

      <!-- Slots de horário -->
      <div class="slots-wrap">
        <div class="slot-row" *ngFor="let slot of day.slots">

          <!-- Label manhã / tarde -->
          <div class="slot-label-wrap">
            <span class="slot-dot" [class.afternoon]="slot.period === 'tarde'"></span>
            <span class="slot-label">{{ slot.period | titlecase }}</span>
          </div>

          <!-- Inputs de hora (somente hora, minutos fixos em :00) -->
          <div class="slot-inputs">

            <div class="hour-picker" (click)="openHourPicker(day, slot, 'start')">
              <span class="hour-value">{{ slot.startHour | hourDisplay }}</span>
              <ion-icon name="chevron-down-outline" class="picker-chevron"></ion-icon>
            </div>

            <span class="time-separator">–</span>

            <div class="hour-picker" (click)="openHourPicker(day, slot, 'end')">
              <span class="hour-value">{{ slot.endHour | hourDisplay }}</span>
              <ion-icon name="chevron-down-outline" class="picker-chevron"></ion-icon>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Espaço para o botão fixo não sobrepor o conteúdo -->
  <div style="height: 90px"></div>

  <ion-button
    expand="block"
    class="salvar-btn"
    (click)="salvar()"
  >
    <ion-icon name="checkmark-outline" slot="start"></ion-icon>
    Salvar alterações
  </ion-button>

</ion-content>
