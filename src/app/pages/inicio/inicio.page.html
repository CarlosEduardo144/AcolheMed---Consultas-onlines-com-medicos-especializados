              fill="#1D1B20" />
          </svg>
        </ion-thumbnail>

        <ion-label>
          <h2 class="prod-descricao">{{ usuario.nome }}</h2>
          <p class="prod-valor">CPF: {{ usuario.cpf }}</p>
          <p class="prod-valor">Tipo: {{ usuario.tipoUsuario }}</p>
          @if (usuario.tipoUsuario == "medico") {
          <p class="prod-valor">
            CRM: {{ isMedico(usuario).crm }}
          </p>
          }
        </ion-label>
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option (click)="excluir(usuario)" color="danger">
          Excluir
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    } @empty {
    <div class="ion-text-center ion-padding">
      <p>Não há usuários cadastrados.</p>
    </div>
    }
  </ion-list>
