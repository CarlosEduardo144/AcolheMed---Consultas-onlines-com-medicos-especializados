<ion-content class="perfil-content" [fullscreen]="true">
  <div class="perfil-wrapper">

    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
      <div class="hero-title-top">Perfil</div>

      <!-- Avatar no banner -->
      <div class="avatar-wrap">
        <div class="avatar-img">
          <img [src]="usuario?.foto || 'https://i.pravatar.cc/200?img=47'" [alt]="usuario?.nome || 'Perfil'" />
        </div>
      </div>

      <p class="avatar-name">{{ usuario?.nome }}</p>
      <p class="avatar-email">{{ usuario?.email }}</p>
    </div>

    <!-- Seção: Informações pessoais -->
    <div class="form-card">Informações pessoais</div>

    <button class="menu-item" routerLink="/alterar-dados">
      <div class="menu-item-text">
        <span class="menu-item-label">Meus dados</span>
        <span class="menu-item-sublabel">Alterar dados da conta</span>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.7806 12.5306L14.0306 19.2806C13.7376 19.5737 13.2624 19.5737 12.9694 19.2806C12.6763 18.9876 12.6763 18.5124 12.9694 18.2194L18.4397 12.75H3.75C3.33579 12.75 3 12.4142 3 12C3 11.5858 3.33579 11.25 3.75 11.25H18.4397L12.9694 5.78062C12.6763 5.48757 12.6763 5.01243 12.9694 4.71938C13.2624 4.42632 13.7376 4.42632 14.0306 4.71938L20.7806 11.4694C20.9215 11.6101 21.0006 11.8009 21.0006 12C21.0006 12.1991 20.9215 12.3899 20.7806 12.5306Z"
          fill="#141414" />
      </svg>
    </button>

    @if(usuario?.tipoUsuario == "medico"){
    <button class="menu-item" routerLink="/add-formacao-profissional">
      <div class="menu-item-text">
        <span class="menu-item-label">Sobre mim</span>
        <span class="menu-item-sublabel">Formação acadêmica e minha descrição</span>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.7806 12.5306L14.0306 19.2806C13.7376 19.5737 13.2624 19.5737 12.9694 19.2806C12.6763 18.9876 12.6763 18.5124 12.9694 18.2194L18.4397 12.75H3.75C3.33579 12.75 3 12.4142 3 12C3 11.5858 3.33579 11.25 3.75 11.25H18.4397L12.9694 5.78062C12.6763 5.48757 12.6763 5.01243 12.9694 4.71938C13.2624 4.42632 13.7376 4.42632 14.0306 4.71938L20.7806 11.4694C20.9215 11.6101 21.0006 11.8009 21.0006 12C21.0006 12.1991 20.9215 12.3899 20.7806 12.5306Z"
          fill="#141414" />
      </svg>
    </button>

    <!--Alterar horários do expediente -->
    <button class="menu-item" routerLink="/alterar-horario">
      <div class="menu-item-text">
        <span class="menu-item-label">Meus horários</span>
        <span class="menu-item-sublabel">Configurar meus horários semanais</span>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.7806 12.5306L14.0306 19.2806C13.7376 19.5737 13.2624 19.5737 12.9694 19.2806C12.6763 18.9876 12.6763 18.5124 12.9694 18.2194L18.4397 12.75H3.75C3.33579 12.75 3 12.4142 3 12C3 11.5858 3.33579 11.25 3.75 11.25H18.4397L12.9694 5.78062C12.6763 5.48757 12.6763 5.01243 12.9694 4.71938C13.2624 4.42632 13.7376 4.42632 14.0306 4.71938L20.7806 11.4694C20.9215 11.6101 21.0006 11.8009 21.0006 12C21.0006 12.1991 20.9215 12.3899 20.7806 12.5306Z"
          fill="#141414" />
      </svg>
    </button>
    }

    <button class="menu-item" (click)="logout()">
      <div class="menu-item-text">
        <span class="menu-item-label menu-item-label--danger">Log Out</span>
        <span class="menu-item-sublabel">Sair da conta</span>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.7806 12.5306L14.0306 19.2806C13.7376 19.5737 13.2624 19.5737 12.9694 19.2806C12.6763 18.9876 12.6763 18.5124 12.9694 18.2194L18.4397 12.75H3.75C3.33579 12.75 3 12.4142 3 12C3 11.5858 3.33579 11.25 3.75 11.25H18.4397L12.9694 5.78062C12.6763 5.48757 12.6763 5.01243 12.9694 4.71938C13.2624 4.42632 13.7376 4.42632 14.0306 4.71938L20.7806 11.4694C20.9215 11.6101 21.0006 11.8009 21.0006 12C21.0006 12.1991 20.9215 12.3899 20.7806 12.5306Z"
          fill="#141414" />
      </svg>
    </button>

    <!-- Seção: Avaliações -->
    <div class="section-title">Avaliações</div>
    <button class="menu-item">
      <div class="menu-item-text">
        @if(usuario?.tipoUsuario == "medico"){
        <span class="menu-item-label">Ver minhas avaliações</span>
        }
        @if(usuario?.tipoUsuario == "paciente"){
        <span class="menu-item-label">Avaliar consultas</span>
        }
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.7806 12.5306L14.0306 19.2806C13.7376 19.5737 13.2624 19.5737 12.9694 19.2806C12.6763 18.9876 12.6763 18.5124 12.9694 18.2194L18.4397 12.75H3.75C3.33579 12.75 3 12.4142 3 12C3 11.5858 3.33579 11.25 3.75 11.25H18.4397L12.9694 5.78062C12.6763 5.48757 12.6763 5.01243 12.9694 4.71938C13.2624 4.42632 13.7376 4.42632 14.0306 4.71938L20.7806 11.4694C20.9215 11.6101 21.0006 11.8009 21.0006 12C21.0006 12.1991 20.9215 12.3899 20.7806 12.5306Z"
          fill="#141414" />
      </svg>
    </button>

    <!-- Seção: Notificações -->
    <div class="section-title">Notificações</div>

    <div class="menu-item menu-item--toggle">
      <div class="menu-item-text">
        <span class="menu-item-label">Lembretes de consultas</span>
        <span class="menu-item-sublabel">Notificações de lembretes de consultas</span>
      </div>
      <ion-toggle [checked]="notificacoesAtivas" (ionChange)="toggleNotificacoes($event)"
        class="custom-toggle"></ion-toggle>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a routerLink="/inicio" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M20.5153 9.72844L13.0153 2.65219C13.0116 2.64899 13.0082 2.64554 13.005 2.64188C12.4328 2.1215 11.5588 2.1215 10.9866 2.64188L10.9762 2.65219L3.48469 9.72844C3.17573 10.0125 2.99994 10.4131 3 10.8328V19.5C3 20.3284 3.67157 21 4.5 21H9C9.82843 21 10.5 20.3284 10.5 19.5V15H13.5V19.5C13.5 20.3284 14.1716 21 15 21H19.5C20.3284 21 21 20.3284 21 19.5V10.8328C21.0001 10.4131 20.8243 10.0125 20.5153 9.72844ZM19.5 19.5H15V15C15 14.1716 14.3284 13.5 13.5 13.5H10.5C9.67157 13.5 9 14.1716 9 15V19.5H4.5V10.8328L4.51031 10.8234L12 3.75L19.4906 10.8216L19.5009 10.8309L19.5 19.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Home</span>
    </a>
    <a routerLink="/consultas" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M19.5 3H17.25V2.25C17.25 1.83579 16.9142 1.5 16.5 1.5C16.0858 1.5 15.75 1.83579 15.75 2.25V3H8.25V2.25C8.25 1.83579 7.91421 1.5 7.5 1.5C7.08579 1.5 6.75 1.83579 6.75 2.25V3H4.5C3.67157 3 3 3.67157 3 4.5V19.5C3 20.3284 3.67157 21 4.5 21H19.5C20.3284 21 21 20.3284 21 19.5V4.5C21 3.67157 20.3284 3 19.5 3ZM6.75 4.5V5.25C6.75 5.66421 7.08579 6 7.5 6C7.91421 6 8.25 5.66421 8.25 5.25V4.5H15.75V5.25C15.75 5.66421 16.0858 6 16.5 6C16.9142 6 17.25 5.66421 17.25 5.25V4.5H19.5V7.5H4.5V4.5H6.75ZM19.5 19.5H4.5V9H19.5V19.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Consultas</span>
    </a>
    <a routerLink="/explorar" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M21.5306 20.4694L16.8366 15.7762C19.6629 12.383 19.3204 7.36693 16.0591 4.38935C12.7978 1.41176 7.77134 1.526 4.64867 4.64867C1.526 7.77134 1.41176 12.7978 4.38935 16.0591C7.36693 19.3204 12.383 19.6629 15.7762 16.8366L20.4694 21.5306C20.7624 21.8237 21.2376 21.8237 21.5306 21.5306C21.8237 21.2376 21.8237 20.7624 21.5306 20.4694ZM3.75 10.5C3.75 6.77208 6.77208 3.75 10.5 3.75C14.2279 3.75 17.25 6.77208 17.25 10.5C17.25 14.2279 14.2279 17.25 10.5 17.25C6.77379 17.2459 3.75413 14.2262 3.75 10.5Z"
          fill="#737373" />
      </svg>
      <span class="nav-label">Explorar</span>
    </a>
    <a routerLink="/perfil" class="nav-item nav-item--active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M21.6497 20.625C21.5157 20.8571 21.268 21.0001 21 21H3C2.73219 20.9997 2.48484 20.8567 2.35106 20.6247C2.21727 20.3927 2.21734 20.1069 2.35125 19.875C3.77906 17.4066 5.97938 15.6366 8.54719 14.7975C5.93645 13.2433 4.68585 10.1364 5.49182 7.2069C6.29779 4.27741 8.96167 2.24745 12 2.24745C15.0383 2.24745 17.7022 4.27741 18.5082 7.2069C19.3141 10.1364 18.0635 13.2433 15.4528 14.7975C18.0206 15.6366 20.2209 17.4066 21.6488 19.875C21.783 20.1069 21.7834 20.3928 21.6497 20.625Z"
          fill="#141414" />
      </svg>
      <span class="nav-label nav-label--active">Perfil</span>
    </a>
  </div>

</ion-content>
