spring.application.name=acolhimed

# Configuracao do banco MySQL (uso local, opcional)
#spring.datasource.url=jdbc:mysql://localhost:3306/acolhimed
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do banco Postgres (Neon) - via variaveis de ambiente
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=create

# Configuracoes de exibicao de SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Garante que o import.sql só rode DEPOIS que o Hibernate recriar todas as tabelas
spring.jpa.defer-datasource-initialization=true

# Define explicitamente o script a ser lido (evita leituras duplicadas por ferramentas como o DevTools)
spring.sql.init.mode=always

# Garante que o JSON gerado mantenha o padrão camelCase
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# API Cloudinary para fotos
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
